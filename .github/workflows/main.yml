name: Build and Push Full-Stack App

on:
  push:
    branches: [ "main" ]

jobs:
  build-backend:
    # এই লাইনটি GitHub-কে বলে: যদি রিপোটি টেমপ্লেট হয়, তবে এই কাজ রান করো না
    if: ${{ github.repository != 'Alif51914/my-devops-template' }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Backend Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/my-app-backend:latest

  build-frontend:
    # এই লাইনটিও একই কাজ করে
    if: ${{ github.repository != 'Alif51914/my-devops-template' }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Frontend Image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/my-app-frontend:latest